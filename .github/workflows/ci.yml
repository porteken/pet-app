on:
  push:
    branches:
      - dev
      - prd
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - name: Install Dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - name: Install Dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run tsc

  vitest-unit:
    name: Vitest Unit (shard ${{ matrix.shard_index }}/${{ matrix.shard_total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard_index: [1, 2, 3, 4, 5]
        shard_total: [5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - name: Install Dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      # Added --coverage to generate data for Sonar
      - run: npm run test:unit -- --reporter=blob --shard=${{ matrix.shard_index }}/${{ matrix.shard_total }} --coverage.enabled=true

      - name: Upload Vitest unit blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-unit-blob-${{ matrix.shard_index }}
          path: .vitest-reports/*
          include-hidden-files: true
          retention-days: 1

  # ... (vitest-integration and playwright-e2e jobs remain largely the same,
  # but ensure vitest-integration also includes the --coverage flag)

  merge-vitest-unit:
    name: Merge Vitest Unit Reports
    needs: vitest-unit
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - name: Install Dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Download Vitest unit blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-vitest-unit-blob-reports
          pattern: vitest-unit-blob-*
          merge-multiple: true

      # Merge reports and ensure LCOV is generated for SonarQube
      - name: Merge Vitest unit reports
        run: npx vitest --merge-reports=./all-vitest-unit-blob-reports --reporter=junit --coverage.enabled=true --coverage.reporter=lcov

      - name: Upload Merged Coverage
        uses: actions/upload-artifact@v4
        with:
          name: merged-unit-coverage
          path: coverage/lcov.info

  sonarqube:
    name: SonarQube Quality Gate
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Skip SonarQube (missing token)
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "SONAR_TOKEN is not set, skipping SonarQube steps."

      - uses: actions/checkout@v4
        if: ${{ env.SONAR_TOKEN != '' }}
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: SonarQube Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}

      - name: SonarQube Quality Gate Check
        if: ${{ env.SONAR_TOKEN != '' }}
        id: sonarqube-quality-gate-check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}

  deploy:
    name: Deploy to Vercel
    if: github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'prd')
    # ADDED 'sonarqube' to needs. Deployment will fail if SonarQube fails.
    needs: [lint, typecheck, vitest-unit, sonarqube]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        shell: bash
        env:
          VERCEL_DEPLOY_HOOK: ${{ github.ref_name == 'prd' && secrets.VERCEL_DEPLOY_HOOK_PRD || secrets.VERCEL_DEPLOY_HOOK_DEV }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "Error: VERCEL_DEPLOY_HOOK for ${{ github.ref_name }} is not set."
            exit 1
          fi
          curl -X POST "$VERCEL_DEPLOY_HOOK"

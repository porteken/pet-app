name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  vitest-unit:
    name: Vitest Unit (shard ${{ matrix.shard_index }}/${{ matrix.shard_total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard_index: [1, 2, 3, 4]
        shard_total: [4]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest unit shard
        run: npm run test:unit -- --reporter=blob --shard=${{ matrix.shard_index }}/${{ matrix.shard_total }}

      - name: Upload Vitest unit blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-unit-blob-${{ matrix.shard_index }}
          path: .vitest-reports/*
          include-hidden-files: true
          retention-days: 1

  vitest-integration:
    name: Vitest Integration (shard ${{ matrix.shard_index }}/${{ matrix.shard_total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard_index: [1, 2]
        shard_total: [2]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest integration shard
        run: npm run test:integration -- --reporter=blob --shard=${{ matrix.shard_index }}/${{ matrix.shard_total }}

      - name: Upload Vitest integration blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-integration-blob-${{ matrix.shard_index }}
          path: .vitest-reports/*
          include-hidden-files: true
          retention-days: 1

  merge-vitest-unit-reports:
    name: Merge Vitest Unit Reports
    if: ${{ always() && !cancelled() }}
    needs: vitest-unit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download unit blob reports
        uses: actions/download-artifact@v5
        with:
          path: .vitest-reports
          pattern: vitest-unit-blob-*
          merge-multiple: true

      - name: Merge unit reports
        run: npx vitest run --merge-reports

  merge-vitest-integration-reports:
    name: Merge Vitest Integration Reports
    if: ${{ always() && !cancelled() }}
    needs: vitest-integration
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download integration blob reports
        uses: actions/download-artifact@v5
        with:
          path: .vitest-reports
          pattern: vitest-integration-blob-*
          merge-multiple: true

      - name: Merge integration reports
        run: npx vitest run --config=vitest.integration.config.ts --merge-reports

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

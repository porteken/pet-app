vitest-unit:
  name: Vitest Unit (shard ${{ matrix.shard_index }}/${{ matrix.shard_total }})
  runs-on: ubuntu-latest
  timeout-minutes: 30
  continue-on-error: true
  strategy:
    fail-fast: false
    matrix:
      shard_index: [1, 2, 3, 4, 5]
      shard_total: [5]

  steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup Node
      uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Run Vitest unit shard
      run: npm run test:unit -- --reporter=blob --shard=${{ matrix.shard_index }}/${{ matrix.shard_total }}

    - name: Upload Vitest unit blob report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: vitest-unit-blob-${{ matrix.shard_index }}
        path: .vitest-reports/
        include-hidden-files: true
        retention-days: 1

    - name: Notify Vercel
      uses: vercel/repository-dispatch/actions/status@v1
      with:
        # This value should be the simple status name you want Vercel to record
        name: vercel-status

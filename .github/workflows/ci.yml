name: CI Pipeline

# ——————————————
# Triggers
# ——————————————
on:
  pull_request: # PR events
  push: # Push events
  workflow_dispatch: # Manual runs

jobs:
  # ——————————————
  # Existing Test Jobs
  # ——————————————

  vitest-unit:
    name: Vitest Unit (shard ${{ matrix.shard_index }}/${{ matrix.shard_total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard_index: [1, 2, 3, 4, 5]
        shard_total: [5]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit -- --reporter=blob --shard=${{ matrix.shard_index }}/${{ matrix.shard_total }}
      - name: Upload Vitest unit blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-unit-blob-${{ matrix.shard_index }}
          path: .vitest-reports/
          include-hidden-files: true
          retention-days: 1

  merge-vitest-unit-reports:
    name: Merge Vitest Unit Reports
    needs: vitest-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          path: all-vitest-unit-blob-reports
          pattern: vitest-unit-blob-*
          merge-multiple: true
      - run: npx vitest --merge-reports=./all-vitest-unit-blob-reports --reporter=default

  # (Integration + Playwright jobs omitted for brevity — use your existing definitions)

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  # ——————————————
  # Aggregated Status Check Job
  # ——————————————
  final-status:
    name: ❗ Final CI Status
    runs-on: ubuntu-latest
    needs:
      - merge-vitest-unit-reports
      - merge-vitest-integration-reports
      - merge-playwright-reports
      - build
    steps:
      - name: Check all required jobs passed
        shell: bash
        run: |
          echo "All dependent jobs must succeed for this check"
          exit 0

name: CI and Deploy

on:
  push:
    branches:
      - dev
      - prd
  pull_request:
  workflow_dispatch:

jobs:
  # ─────────── Vitest Unit Shards ───────────
  vitest-unit:
    name: Vitest Unit (shard ${{ matrix.shard_index }}/5)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard_index: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Force .vitest-reports Directory
        run: mkdir -p .vitest-reports

      - name: Run Vitest Unit Shard
        run: |
          npx vitest run --shard=${{ matrix.shard_index }}/5 --reporter=blob
        continue-on-error: true

      - name: Upload Vitest Unit Blob
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-unit-blob-${{ matrix.shard_index }}
          path: .vitest-reports/*.json

  # ─────────── Merge Vitest Unit ───────────
  merge-vitest-unit:
    name: Merge Vitest Unit Reports
    needs: vitest-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prepare .vitest-reports
        run: mkdir -p .vitest-reports

      - name: Download Vitest Unit Blobs
        uses: actions/download-artifact@v4
        with:
          path: .vitest-reports
          pattern: vitest-unit-blob-*

      - name: Merge Vitest Unit Blobs
        run: npx vitest run --merge-reports --reporter=junit
        shell: bash

  # ─────────── Vitest Integration Shards ───────────
  vitest-integration:
    name: Vitest Integration (shard ${{ matrix.shard_index }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard_index: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Force .vitest-reports Directory
        run: mkdir -p .vitest-reports

      - name: Run Vitest Integration Shard
        run: |
          npx vitest run --shard=${{ matrix.shard_index }}/2 --reporter=blob
        continue-on-error: true

      - name: Upload Vitest Integration Blob
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-integration-blob-${{ matrix.shard_index }}
          path: .vitest-reports/*.json

  # ─────────── Merge Vitest Integration ───────────
  merge-vitest-integration:
    name: Merge Vitest Integration Reports
    needs: vitest-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prepare .vitest-reports
        run: mkdir -p .vitest-reports

      - name: Download Vitest Integration Blobs
        uses: actions/download-artifact@v4
        with:
          path: .vitest-reports
          pattern: vitest-integration-blob-*

      - name: Merge Vitest Integration Blobs
        run: npx vitest run --merge-reports --reporter=junit
        shell: bash
# (Playwright + Build + Deploy jobs omitted for brevity… use previous workflow)
